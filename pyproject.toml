[project]
name = "solana-memecoin-bot"
version = "1.0.0"
description = "Production Solana memecoin trading bot with paper/live trading"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "aiohttp>=3.10.0",
    "solders>=0.21.0",
    "solana>=0.34.0",
    "base58>=2.1.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "cryptography>=43.0.0",
    "alembic>=1.13.0",
    "python-telegram-bot>=21.0",
    "tenacity>=9.0.0",
    "cachetools>=5.5.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
bot = "backend.services.bot:main"
report = "backend.backtest.report:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
